[package]
name = "jams"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3.31"
ffmpeg-next = { version = "8.0.0" }
clap = { version = "4.5.57", features = ["derive"] }
walkdir = "2.5.0"
blake3 = "1.8.3"
rayon = "1.11.0"
rand = "0.9.2"
parking_lot = { version = "0.12.5", features = ["nightly"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.8.8", features = ["ws", "macros"] }
tokio-util = { version = "0.7.18", features = [
    "codec",
    "compat",
    "rt",
    "io",
    "net",
    "time",
] }
http-range-header = "0.4.2"
once_cell = "1.21.3"
mime_guess = "2.0.5"
