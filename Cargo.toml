[package]
name = "jams"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "env",
] }
walkdir = "2.5.0"
rand = "0.9"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "query",
    "ws",
] }
anyhow = "1.0.104"
lofty = "0.25.5"
arc-swap = "1.9.3"
headers = "0.4.2"
nanoid = "0.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
