[package]
name = "jams"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
clap = { version = "4.6.0", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
walkdir = "2.5.0"
rand = "0.9"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
http-range-header = "0.4.2"
anyhow = "1.0.102"
lofty = "0.25.4"
arc-swap = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
