[package]
name = "jams"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = "0.15.7"
dirs = { version = "6.0.0" }
tokio = { version = "1.45.0", features = ["full"] }
futures = "0.3.31"
ffmpeg-next = { version = "7.1.0" }
clap = { version = "4.5.40", features = ["derive"] }
walkdir = "2.5.0"
blake3 = "1.8.2"
rayon = "1.10.0"
rand = "0.9.1"
parking_lot = { version = "0.12.4", features = ["nightly"] }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
axum = { version = "0.8.4", features = ["ws", "macros"] }
itertools = "0.14.0"
toml = "0.8.23"
tokio-util = { version = "0.7.15", features = [
    "codec",
    "compat",
    "rt",
    "io",
    "net",
    "time",
] }
tokio-stream = { version = "0.1.17", features = ["full"] }
http-range-header = "0.4.2"
